<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Name</title>
  <style>
    :root { --bg: #fdfdfc; --fg: #1f2328; --muted: #656d76; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d1117; --fg: #e6edf3; --muted: #8d96a0; --link: #4493f8; }
    }
    body {
      margin: 0 auto; max-width: 40rem; padding: 4rem 1rem;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, sans-serif;
    }
    h1 { margin: 0 0 .25rem; font-size: 2rem; }
    .bio { margin: 0 0 2rem; color: var(--muted); }
    h2 { font-size: 1.1rem; margin-top: 2.5rem; }
    a { color: var(--link); }
    ul { padding-left: 1.2rem; }
  </style>
</head>
<body>
  <h1>Your Name</h1>
  <p class="bio">One-line bio goes here.</p>

  <h2>About</h2>
  <p>A short paragraph about what you do and what you care about.</p>

  <h2>Projects</h2>
  <ul>
    <li><a href="#">Project one</a> — what it does in one line.</li>
    <li><a href="#">Project two</a> — what it does in one line.</li>
  </ul>

  <h2>Elsewhere</h2>
  <ul>
    <li><a href="#">GitHub</a></li>
    <li><a href="#">LinkedIn</a></li>
    <li><a href="mailto:you@example.com">Email</a></li>
  </ul>
</body>
</html>
