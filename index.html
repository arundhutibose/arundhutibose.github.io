<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arundhuti Bose · Artist & Art Psychotherapist</title>
    <meta name="description" content="Paintings, clay and commissions. A new home for my art is being built. Say hello meanwhile." />
    <!-- Colours the phone browser's address bar. One solid colour only: browsers don't
         accept gradients here, so it uses the coral from the boseitup logo, and a
         gradient band at the top of the page carries on from it. -->
    <meta name="theme-color" content="#f29aa5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#8a3f4a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Link preview (WhatsApp, iMessage, Instagram, Slack...). __SITE_URL__ is set in vite.config.ts -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arundhuti Bose" />
    <meta property="og:title" content="Arundhuti Bose · Artist & Art Psychotherapist" />
    <meta property="og:description" content="Paintings, clay and commissions. A new home for my art is being built. Say hello meanwhile." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Arundhuti Bose, over her painting of mountains under a crescent moon" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sacramento&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
